<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Theory Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <h1 class="text-center">Color Categories</h1>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <h2>Primary Colors</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <div id="red"></div>
        <h5>#FF0000</h5>
      </div>
      <div class="col-4">
        <div id="blue"></div>
        <h5>#0000FF</h5>
      </div>
      <div class="col-4">
        <div id="yellow"></div>
        <h5>#FFEA00</h5>
      </div>
    </div>
    <br></br>
    <div class="row">
      <div class="col-12">
        <h2>Secondary Colors</h2>
      </div>
    </div>
    <div class="row">
        <div class="col-4">
          <div id="orange"></div>
          <h5>#FFAC1C</h5>
        </div>
      
        <div class="col-4">
          <div id="green"></div>
          <h5>#008000</h5>
        </div>
        <div class="col-4">
          <div id="purple"></div>
          <h5>#5D3FD3</h5>
        </div>
      </div>
      <div class="row">
      <div class="col-12">
        <h2>Tertiary Colors</h2>
      </div>
    </div>
    <div class="row">
        <div class="col-2">
          <div id="yellowgreen"></div>
          <h5>#CCFF00</h5>
        </div>
      
        <div class="col-2">
          <div id="yelloworange"></div>
          <h5>#FFB343</h5>
        </div>
        <div class="col-2">
          <div id="redorange"></div>
          <h5>#FFBF00</h5>
        </div>
        <div class="col-2">
          <div id="redviolet"></div>
          <h5>#c71585</h5>
        </div>
      
        <div class="col-2">
          <div id="blueviolet"></div>
          <h5>#8a2be2</h5>
        </div>
        <div class="col-2">
          <div id="bluegreen"></div>
          <h5>#0CBAA6</h5>
        </div>
      </div>
      <div class="row">
      <div class="col-12">
        <h2>Warm Colors</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-2">
          <div id="red"></div>
          <h5>#ff0000</h5>
        </div>
        <div class="col-2">
          <div id="redorange"></div>
          <h5>#FFBF00</h5>
        </div>
        <div class="col-2">
          <div id="redviolet"></div>
          <h5>#c71585</h5>
        </div>
        <div class="col-2">
          <div id="yellow"></div>
          <h5>#CCFF00</h5>
        </div>
      
        <div class="col-2">
          <div id="yelloworange"></div>
          <h5>#FFB343</h5>
        </div>

        <div class="col-2">
          <div id="orange"></div>
          <h5>#FFAC1C</h5>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
